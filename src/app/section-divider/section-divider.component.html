<div class="section-divider bg-black" [ngClass]="'divider-' + variant" [style.height]="height">
  <div class="divider-content">
    @if (variant === 'gradient') {
      <div class="gradient-line"></div>
    }
    @if (variant === 'wave') {
      <svg class="wave-svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path d="M0,0 Q300,60 600,30 T1200,0" class="wave-path"></path>
      </svg>
    }
    @if (variant === 'ornamental') {
      <div class="ornamental-line">
        <div class="ornament-left"></div>
        <div class="ornament-center">
          <svg width="40" height="40" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="3" fill="currentColor"/>
            <circle cx="20" cy="20" r="8" fill="none" stroke="currentColor" stroke-width="0.5"/>
            <circle cx="20" cy="20" r="13" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.5"/>
          </svg>
        </div>
        <div class="ornament-right"></div>
      </div>
    }
    @if (variant === 'glow') {
      <div class="glow-line">
        <div class="glow-pulse"></div>
      </div>
    }
  </div>
</div>
